<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        
        .error-card {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        .error-code {
            font-size: 6rem;
            font-weight: 700;
            font-family: var(--font-mono);
            color: var(--accent-pink);
            line-height: 1;
            margin-bottom: 16px;
        }
        
        .error-terminal {
            background: rgba(0,0,0,0.2);
            padding: 16px;
            border-radius: var(--radius-sm);
            margin: 24px 0;
            font-family: var(--font-mono);
            text-align: left;
            border: 1px dashed var(--border);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="card error-card">
            <div class="error-code">404</div>
            <h3>Page Not Found</h3>
            <p class="body-text">The requested URL was not found on this server.</p>
            
            <div class="error-terminal">
                <span style="color: var(--accent-pink); font-weight: 600;">jotalac@server:~$</span> <span style="color: var(--accent-blue);">cat</span> target_url<br>
                <span style="color: #ed8796;">cat: target_url: No such file or directory</span>
            </div>
            
            <div style="display: flex; justify-content: center; margin-top: 32px;">
                <a href="/" class="link-btn"><span class="material-symbols-outlined">home</span> Return Home</a>
            </div>
        </div>
    </div>
</body>
</html>
